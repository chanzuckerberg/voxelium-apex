name: Upload Python Package

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      # - release-test
  workflow_dispatch:

# Least privilege: only read access to repo contents is needed
permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CUDA Toolkit 12.4 (nvcc + cudart)
        run: |
          set -euxo pipefail

          # Identify Ubuntu version (e.g., 22.04 -> 2204)
          UBUNTU_VERSION="$(. /etc/os-release && echo "${VERSION_ID}" | tr -d '.')"
          echo "Ubuntu version: ${UBUNTU_VERSION}"

          # Install NVIDIA CUDA apt repo keyring
          curl -fsSL -o cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VERSION}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring.deb
          sudo apt-get update

          # Install CUDA toolkit 12.4 (provides nvcc, libcudart, headers)
          sudo apt-get install -y --no-install-recommends cuda-toolkit-12-4

          # Sanity checks
          nvcc --version
          ls -l /usr/local/cuda || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools setuptools_scm wheel twine build torch
          pip install -e .

      # - name: Publish to PyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     python -m pip install --upgrade twine
      #     twine upload wheelhouse/*
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to TestPyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install --upgrade twine
          twine upload --repository-url https://test.pypi.org/legacy/ wheelhouse/* --verbose
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}

      # Optional: extra cleanup at end
      - name: Docker prune (post-build)
        if: always()
        run: docker system prune -af --volumes
