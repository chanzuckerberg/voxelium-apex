[metadata]
name = negatron
description = negatron: code name for the positron library deployment test
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/dkimanius/positron
author = Dari Kimanius
author_email = dari.kimanius@czii.org
license = GPLv2
license_file = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Natural Language :: English
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
project_urls =
    Source Code =https://github.com/dkimanius/positron

[options]
packages = find:
install_requires =
    python=3.11
    setuptools
    pip
    eigen
    loguru
    matplotlib
    mrcfile>=1.4.3
    numpy
    vtk
    scikit-learn
    scipy
    tensorboard
    torch==2.2.*
    torchvision
    tqdm
    starfile
    umap-learn
    imageio
    msgpack

python_requires = >=3.11
setup_requires =
    setuptools_scm
zip_safe = False
include_package_data = True

[options.extras_require]
dev =
    black
    flake8
    flake8-docstrings
    ipython
    isort
    jedi<0.18.0
    mkdocs
    mkdocs-material
    mypy
    pre-commit
    pydocstyle
    pytest
    pyinstaller
testing =
    pytest

[bdist_wheel]
universal = 1

[flake8]
exclude = docs,_version.py,.eggs,examples
max-line-length = 88
docstring-convention = numpy
ignore = D100, D213, D401, D413, D107, W503


[tool:pytest]
addopts = -W error

